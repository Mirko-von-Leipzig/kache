name: PR 1639 Windows IPC diagnostic

on:
  push:
    branches: [repair/pr-1639-native-check]

permissions:
  contents: read

concurrency:
  group: pr-1639-windows-ipc
  cancel-in-progress: false

jobs:
  ipc:
    name: Windows IPC
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      RUSTC_WRAPPER: ""
      RUSTC_WORKSPACE_WRAPPER: ""
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: short
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - name: Check IPC targets
        run: cargo clippy --locked -p kache-ipc --all-targets -- -D warnings
      - name: Test native IPC
        run: cargo test --locked -p kache-ipc --lib -- --nocapture
