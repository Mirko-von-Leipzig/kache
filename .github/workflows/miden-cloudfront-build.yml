name: Build Miden cache bundle trial

on:
  push:
    branches: [miden-cloudfront, miden-ci-bundles]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ""
      KACHE_VERSION: v2.0.0-rc.2-miden.2
      CARGO_PROFILE_TEST_DEBUG: "0"
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test remote caching and configuration
        run: |
          ./scripts/with-test-resources.sh cargo test --locked --lib remote_backend::tests::
          ./scripts/with-test-resources.sh cargo test --locked --lib config_tui::tests::
          cargo test --locked -p kache-config
          cargo test --locked --lib remote_bundle::tests::
          cargo test --locked --lib remote_pack::tests::
          cargo test --locked --lib prediction_share::tests::
          cargo test --locked --lib ci_bundle_commands_route_and_parse_limits
      - name: Build client and engine
        run: cargo build --locked --release --bin kache --bin kache-engine
      - name: Test automatic bundle lifecycle
        run: bash scripts/test-ci-bundles.sh target/release/kache
      - name: Package and smoke-test isolated installation
        run: |
          mkdir dist install
          archive="kache-v2.0.0-rc.2-miden.2-${TARGET}.tar.gz"
          tar -czf "dist/${archive}" -C target/release kache kache-engine
          tar -xzf "dist/${archive}" -C install
          install/kache --version
          install/kache-engine --version
          install/kache restore-bundle --help
          install/kache save-bundle --help
          export KACHE_CACHE_DIR="${RUNNER_TEMP}/kache-smoke-cache"
          export KACHE_RUNTIME_DIR="${RUNNER_TEMP}/kache-smoke-run"
          export KACHE_CONFIG="${RUNNER_TEMP}/kache-smoke.toml"
          printf '[cache]\n' > "${KACHE_CONFIG}"
          kache_bin="${PWD}/install/kache"
          trap '"${kache_bin}" daemon stop' EXIT
          install/kache daemon start
          install/kache stats --json
          git rev-parse HEAD > dist/SOURCE_COMMIT
          cd dist
          sha256sum kache-*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kache-cloudfront-${{ matrix.target }}
          path: dist/
          retention-days: 30
