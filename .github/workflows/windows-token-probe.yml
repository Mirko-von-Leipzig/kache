name: Windows token context probe
on:
  push:
    branches: [fix/shim-daemon-ci]
permissions:
  contents: read
jobs:
  token-context:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Inspect documented token records
        shell: pwsh
        run: |
          $source = @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          public class TokenProbe {
            [DllImport("advapi32.dll", SetLastError=true)] static extern bool OpenProcessToken(IntPtr p, uint access, out IntPtr token);
            [DllImport("kernel32.dll")] static extern IntPtr GetCurrentProcess();
            [DllImport("kernel32.dll")] static extern bool CloseHandle(IntPtr h);
            [DllImport("advapi32.dll", SetLastError=true)] static extern bool GetTokenInformation(IntPtr t, int c, IntPtr b, int n, out int length);
            [StructLayout(LayoutKind.Sequential)] struct Access {
              public IntPtr SidHash, RestrictedSidHash, Privileges;
              public long AuthenticationId;
              public int TokenType, ImpersonationLevel;
              public uint MandatoryPolicy, Flags, AppContainerNumber;
              public IntPtr PackageSid, CapabilitiesHash, TrustLevelSid, SecurityAttributes;
            }
            [DllImport("advapi32.dll", SetLastError=true)] static extern bool DuplicateTokenEx(IntPtr token,uint access,IntPtr attributes,int level,int type,out IntPtr duplicate);
            [DllImport("advapi32.dll", SetLastError=true)] static extern bool CreateRestrictedToken(IntPtr token,uint flags,uint disable,IntPtr sids,uint delete,IntPtr privileges,uint restrict,IntPtr restricted,out IntPtr result);
            static void Read(IntPtr token, int cls) {
              int length;
              GetTokenInformation(token, cls, IntPtr.Zero, 0, out length);
              IntPtr p=Marshal.AllocHGlobal(length);
              try {
                if (!GetTokenInformation(token,cls,p,length,out length)) throw new Win32Exception();
                Console.Write("class="+cls+" length="+length+" first="+Marshal.ReadInt32(p));
                if (cls==33 || cls==34) Console.Write(" attribute_count="+Marshal.ReadInt32(p,4));
                if (cls==10) Console.Write(" token_id="+Marshal.ReadInt64(p)+" modified_id="+Marshal.ReadInt64(p,48));
                if (cls==22) {
                  Access a=Marshal.PtrToStructure<Access>(p);
                  Console.Write(" type="+a.TokenType+" flags="+a.Flags+" opaque_attributes="+(a.SecurityAttributes!=IntPtr.Zero)+" trust_sid="+(a.TrustLevelSid!=IntPtr.Zero));
                }
                Console.WriteLine();
              } finally { Marshal.FreeHGlobal(p); }
            }
            public static void Run() {
              IntPtr token;
              if (!OpenProcessToken(GetCurrentProcess(),0xA,out token)) throw new Win32Exception();
              try {
                foreach (int cls in new [] {29,33,34,30,22,18,20,12,26,21,23,24,27,10,1,4,5,25,2,11,37,3,6}) Read(token,cls);
                IntPtr duplicate;
                if (!DuplicateTokenEx(token,0xA,IntPtr.Zero,2,1,out duplicate)) throw new Win32Exception();
                try { Console.Write("duplicate "); Read(duplicate,10); } finally { CloseHandle(duplicate); }
                IntPtr restricted;
                if (!CreateRestrictedToken(token,1,0,IntPtr.Zero,0,IntPtr.Zero,0,IntPtr.Zero,out restricted)) throw new Win32Exception();
                try { Console.Write("restricted "); Read(restricted,10); } finally { CloseHandle(restricted); }
              }
              finally { CloseHandle(token); }
            }
          }
          '@
          $env:PROBE_SOURCE = Join-Path $env:RUNNER_TEMP 'token-probe.cs'
          Set-Content -Path $env:PROBE_SOURCE -Value $source
          Add-Type -Path $env:PROBE_SOURCE
          'Parent context'
          [TokenProbe]::Run()
          'Child context'
          & (Get-Process -Id $PID).Path -NoProfile -Command 'Add-Type -Path $env:PROBE_SOURCE; [TokenProbe]::Run()'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Check native IPC admission and transfer tests
        shell: pwsh
        env:
          RUSTC_WRAPPER: ''
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 test --locked -p kache-ipc --no-default-features -- --nocapture
          exit $LASTEXITCODE
