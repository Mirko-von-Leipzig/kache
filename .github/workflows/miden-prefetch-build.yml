name: Build Miden prefetch trial

on:
  push:
    branches: [miden-prefetch-v1.2.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ""
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test daemon behavior
        run: |
          ./scripts/with-test-resources.sh cargo test --locked --bin kache daemon::tests::
      - name: Build release binary
        run: cargo build --locked --release --bin kache
      - name: Package trial binary
        run: |
          mkdir dist
          target/release/kache --version
          tar -czf dist/kache-v1.2.2-miden.1-x86_64-unknown-linux-gnu.tar.gz -C target/release kache
          git rev-parse HEAD > dist/SOURCE_COMMIT
          cd dist
          sha256sum kache-*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kache-prefetch-trial-linux-x64
          path: dist/
          retention-days: 30
